{% extends 'base.html' %}

{% block title %}Delete Question{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card custom-card shadow border-0">
                <div class="card-header bg-danger text-white py-3">
                    <h5 class="fw-bold mb-0">
                        <i class="bi bi-exclamation-triangle-fill me-2"></i> Confirm Question Deletion
                    </h5>
                </div>
                <div class="card-body p-4 text-center">
                    <div class="stat-icon danger mx-auto mb-3" style="width: 64px; height: 64px; font-size: 2rem;">
                        <i class="bi bi-trash-fill"></i>
                    </div>
                    <h5 class="fw-bold text-dark mb-2">Delete Question #{{ question.id }}?</h5>
                    <p class="text-secondary bg-light p-3 rounded mb-4 text-start small">
                        "{{ question.question_text }}"
                    </p>

                    <form method="post">
                        {% csrf_token %}
                        <div class="d-flex justify-content-center gap-3">
                            <a href="{% url 'admin_question_list_by_quiz' quiz_id=question.quiz.id %}" class="btn btn-secondary-custom px-4">
                                Cancel
                            </a>
                            <button type="submit" class="btn btn-danger px-4 fw-bold">
                                Yes, Delete Question
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
